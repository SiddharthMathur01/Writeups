{% extends "base.html" %}
{% block container %}
  {% include "partials/terminal.html" %}
  {% set platform = page.url.split('/')[0] %}
  {% set slug = page.url.rstrip('/').split('/')[-1] %}
  <template id="terminal-writeup-template">
    <article class="md-typeset terminal-writeup">
      <header class="ctf-writeup-hero">
        <div class="ctf-writeup-hero__badges">
          {% set diff = (page.meta.difficulty or "Medium") | lower %}
          <span class="ctf-badge {% if diff == 'easy' %}ctf-badge--easy{% elif diff == 'hard' %}ctf-badge--hard{% else %}ctf-badge--medium{% endif %}">{{ page.meta.difficulty or "Medium" }}</span>
          <span class="ctf-badge ctf-badge--dark">{{ page.meta.category or platform }}</span>
          {% for tag in page.meta.tags or [] %}<span class="ctf-badge">{{ tag }}</span>{% endfor %}
        </div>
        <h1>{{ page.meta.title or page.title }}</h1>
        <div class="ctf-writeup-hero__facts">
          {% if page.meta.points %}<div class="ctf-fact"><span class="ctf-fact__label">Points</span><span class="ctf-fact__value">{{ page.meta.points }}</span></div>{% endif %}
          {% if page.meta.solve_time %}<div class="ctf-fact"><span class="ctf-fact__label">Est. Solve Time</span><span class="ctf-fact__value">{{ page.meta.solve_time }}</span></div>{% endif %}
          <div class="ctf-fact"><span class="ctf-fact__label">Author</span><span class="ctf-fact__value">{{ page.meta.author or config.site_author }}</span></div>
          {% if page.meta.date %}<div class="ctf-fact"><span class="ctf-fact__label">Date</span><span class="ctf-fact__value">{{ page.meta.date }}</span></div>{% endif %}
        </div>
      </header>
      {% include "partials/content.html" %}
    </article>
  </template>
{% endblock %}
